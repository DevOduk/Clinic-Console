name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Step 1 - Check Code Formatting
        run: npm run format:check

      - name: Step 2 - Run Linter
        run: npm run lint

      - name: Step 3 - Run Test Suite
        run: npm test --if-present
